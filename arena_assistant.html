<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arena Assistant</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#f0f3f6}
main{max-width:1000px;margin:auto;padding:16px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-size:22px;margin:0}
a{color:#58a6ff}
.row{display:flex;gap:8px;margin:10px 0}
input,select,button{font:inherit;border-radius:10px;border:1px solid #3d444d;padding:11px}
input,select{background:#151b23;color:#fff;min-width:0}
input[type=text],input:not([type]){flex:1}
button{background:#21262d;color:#f0f3f6;font-weight:700;cursor:pointer}
button.primary{background:#238636;border-color:#238636;flex:1}
button.danger{background:#2d1618;border-color:#a4232a;color:#ffb4b0;font-weight:400}
.status{font-size:13px;color:#9da7b3;min-height:20px;padding:4px 2px}
.frame{position:relative;background:#000;border-radius:12px;overflow:hidden;margin-top:8px;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#screen,#view{display:block;width:100%;height:auto;min-height:120px;
  pointer-events:none;-webkit-touch-callout:none;-webkit-user-drag:none}
#view[hidden],#screen[hidden]{display:none}
#zoom{position:relative;transform-origin:0 0}
#ov{position:absolute;inset:0;pointer-events:none}
.box{position:absolute;border:2px solid rgba(240,136,62,.55);border-radius:3px}
.box.art{border-color:#3fb950;border-width:2px;pointer-events:auto;cursor:move;touch-action:none}
.box.art.on{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.35)}
.box.art i{position:absolute;top:-16px;left:-2px;font-style:normal;font-size:10px;
  background:#3fb950;color:#000;padding:0 4px;border-radius:3px}
.box.art u{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;
  background:#3fb950;border:2px solid #0d1117;border-radius:50%;
  cursor:nwse-resize;touch-action:none}
.box.mana{border-color:#1f6feb;border-style:dashed}
.artPrev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.artPrev figure{margin:0}
.artPrev figcaption{font-size:11px;color:#9da7b3;text-align:center;margin-bottom:4px}
.artPrev canvas{width:100%;height:auto;border-radius:7px;border:1px solid #30363d;
  background:#000;display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.card{background:#151b23;border:1px solid #30363d;border-radius:12px;padding:10px}
.card h2{font-size:13px;margin:0 0 8px;color:#9da7b3}
.card h2 .mana{display:inline-block;background:#1f6feb;color:#fff;border-radius:50%;
  width:18px;height:18px;line-height:18px;text-align:center;font-size:11px}
.card img.q{width:100%;border-radius:6px;display:block;background:#000}
.opts{flex-wrap:wrap;align-items:center}
.hit{display:flex;gap:10px;align-items:center;margin:0 0 8px}
.hit img{width:88px;height:auto;border-radius:6px;background:#000;flex:none}
.hit .meta{min-width:0;flex:1}
.hit .nm2{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr{font-size:12px;color:#9da7b3;margin-top:4px;line-height:1.5}
.wrRow{display:flex;flex-wrap:wrap;gap:0 8px}
.wrRow .wrLab{min-width:5.5em;color:#6e7781}
.wrRow.strong{color:#f0f3f6}
.wrRow b{color:#3fb950;font-variant-numeric:tabular-nums;font-size:13px}
.wrRow.low b{color:#f85149}
.wr small{opacity:.65}
input.find{width:100%;margin-top:9px;padding:8px 10px;font-size:13px}
.found{list-style:none;margin:6px 0 0;padding:0;max-height:210px;overflow:auto}
.found li{display:flex;gap:8px;align-items:center;padding:5px 0;
  border-top:1px solid #21262d;cursor:pointer;font-size:13px}
.found li img{width:44px;height:auto;border-radius:4px;background:#000;flex:none}
.badge{display:inline-block;margin:8px 0 6px;font-size:11px;padding:3px 8px;border-radius:20px}
.badge.ok{background:#12301c;color:#3fb950;border:1px solid #238636}
.badge.uncertain{background:#2b2411;color:#d29922;border:1px solid #9e6a03}
.badge.nomatch{background:#2d1618;color:#f85149;border:1px solid #a4232a}
.cands{list-style:none;margin:0;padding:0;counter-reset:r}
.cands li{display:flex;justify-content:space-between;gap:6px;font-size:13px;
  padding:5px 0;border-top:1px solid #21262d}
.cands li:first-child{border-top:0;font-weight:700}
.cands li::before{counter-increment:r;content:counter(r) ".";color:#6e7781;margin-right:4px}
.cands li{cursor:pointer}
.cands li.pick{color:#58a6ff}
#go{display:none;width:100%;background:#1f6feb;border-color:#1f6feb;margin:2px 0 4px;padding:14px}
#picked{font-size:13px;color:#9da7b3;margin-bottom:6px;line-height:1.7}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{color:#9da7b3;font-variant-numeric:tabular-nums}
details{margin-top:14px;background:#151b23;border:1px solid #30363d;border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:700}
.calibGrid{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:10px}
.calibGrid input{padding:0}
.calibGrid b{font-variant-numeric:tabular-nums;font-size:12px;min-width:42px;text-align:right}
.hint{font-size:12px;color:#9da7b3;line-height:1.6}
.flipRow{display:flex;align-items:center;gap:8px;font-size:13px;color:#f0f3f6}
#alert{display:none;background:#2d1618;border:1px solid #a4232a;color:#ffb4b0;
  border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.7}
#alert code{background:#0d1117;padding:2px 6px;border-radius:4px}
@media(max-width:620px){
  .cards{grid-template-columns:1fr}
  /* 1列のときだけ勝率順に並べ替える。3列表示では左右の位置を保つ */
  .card{order:var(--rank,0)}
}
</style>
</head>
<body>
<main>
<header>
  <h1>Arena Assistant</h1>
  <a href="arena_test.html">検証ページ</a>
</header>

<div id="alert"></div>

<div class="row">
  <input id="host" placeholder="192.168.11.6 または http://192.168.11.6">
  <button id="connect">接続</button>
</div>

<div class="row">
  <select id="hero" aria-label="クラス">
    <option value="">全クラス</option>
    <option>DEATHKNIGHT</option><option>DEMONHUNTER</option><option>DRUID</option>
    <option>HUNTER</option><option>MAGE</option><option>PALADIN</option>
    <option>PRIEST</option><option>ROGUE</option><option>SHAMAN</option>
    <option>WARLOCK</option><option>WARRIOR</option>
  </select>
  <button id="judge" class="primary">判定</button>
</div>

<div class="row opts">
  <label class="flipRow"><input type="checkbox" id="loop">ループ判定（5秒ごと）</label>
  <label class="flipRow"><input type="checkbox" id="arenaOnly" checked>アリーナ対象のみ</label>
</div>

<button id="go">HSReplay で3枚の勝率を見る</button>
<div id="picked"></div>

<div id="status" class="status">接続先を入力してください。</div>

<div class="frame">
  <div id="zoom">
    <img id="screen" alt="">
    <canvas id="view" hidden></canvas>
    <div id="ov" hidden></div>
  </div>
</div>

<div id="cards" class="cards"></div>

<details>
  <summary>切り取り範囲の調整</summary>
  <p class="hint">緑の枠が認識に使う範囲です。<b>枠をドラッグで移動、右下の丸でサイズ変更</b>。
  左・中央・右はそれぞれ独立しています。カードの絵だけが入るよう合わせてください。
  設定はサーバに保存され、検証ページと共有されます。</p>
  <div class="calibGrid">
    <span>X %</span><input type="range" id="ax" min="0" max="95" step="0.1"><b id="axv"></b>
    <span>Y %</span><input type="range" id="ay" min="0" max="95" step="0.1"><b id="ayv"></b>
    <span>幅 %</span><input type="range" id="aw" min="2" max="100" step="0.1"><b id="awv"></b>
    <span>高さ %</span><input type="range" id="ah" min="2" max="100" step="0.1"><b id="ahv"></b>
  </div>
  <div class="row">
    <label class="flipRow"><input type="checkbox" id="zoomOn" checked>
      カード部分だけを拡大して調整する</label>
  </div>
  <div class="row">
    <label class="flipRow"><input type="checkbox" id="flip" checked>
      配信が上下逆のときに ON（180°補正）</label>
  </div>
  <div class="row">
    <select id="calSlot" aria-label="調整する枠">
      <option value="left">左の枠</option>
      <option value="middle">中央の枠</option>
      <option value="right">右の枠</option>
    </select>
    <button id="copyAll">この枠を3枚に適用</button>
    <button id="resetCal">初期値に戻す</button>
  </div>
  <div class="artPrev" id="artPrev">
    <figure><figcaption>左</figcaption><canvas></canvas></figure>
    <figure><figcaption>中央</figcaption><canvas></canvas></figure>
    <figure><figcaption>右</figcaption><canvas></canvas></figure>
  </div>
</details>

<div class="row">
  <button id="quit" class="danger">サーバを停止</button>
</div>

<p class="hint" id="info"></p>
</main>

<script>
/* ==========================================================================
   共通部（arena_test.html と同じ内容を保つこと）
   ========================================================================== */
const SLOTS = [
  { key: 'left', label: '左' },
  { key: 'middle', label: '中央' },
  { key: 'right', label: '右' }
];
// サーバ側の PW/PH, GW*2/GH*2 と一致させること
const PW = 48, PH = 32, CW = 12, CH = 8;
// マナ結晶。アート枠からの相対位置で求める。サーバの MANA_REL と揃えること
const MW = 28, MH = 32;
const MANA_REL = { x: -0.391, y: -0.191, w: 0.393, h: 0.492 };

function manaRect(key, iw, ih) {
  const a = ART[key];
  return {
    x: (a.x + MANA_REL.x * a.w) * (iw || 1),
    y: (a.y + MANA_REL.y * a.h) * (ih || 1),
    w: MANA_REL.w * a.w * (iw || 1),
    h: MANA_REL.h * a.h * (ih || 1)
  };
}
function extractMana(src, r, iw, ih) {
  if (r.x < 0 || r.y < 0 || r.x + r.w > iw || r.y + r.h > ih) return '';
  const c = document.createElement('canvas');
  c.width = MW; c.height = MH;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, MW, MH);
  const d = cx.getImageData(0, 0, MW, MH).data;
  const g = new Uint8Array(MW * MH);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    g[j] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;
  }
  return toB64(g);
}

// 切り取り範囲はフレーム全体に対する比率。配信が全画面か分割表示かで
// 位置が変わるため固定座標にしない。値はサーバに保存し iPad と共有する。
let ART = null;
let saveTimer = null;

// 配信が 180° ひっくり返る場合の補正。表示も切り出しもこの補正後の画像を見る。
let FLIP = true;

function applyFlip() {
  const img = $('screen'), cv = $('view');
  if (!img.naturalWidth) return;
  if (FLIP) {
    cv.width = img.naturalWidth;
    cv.height = img.naturalHeight;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.translate(cv.width, cv.height);
    cx.rotate(Math.PI);
    cx.drawImage(img, 0, 0);
    cx.setTransform(1, 0, 0, 1, 0, 0);
  }
  cv.hidden = !FLIP;
  img.hidden = FLIP;
}

function frameSrc() {
  return FLIP ? $('view') : $('screen');
}
function frameW() {
  const s = frameSrc();
  return s.naturalWidth || s.width;
}
function frameH() {
  const s = frameSrc();
  return s.naturalHeight || s.height;
}

async function loadArt() {
  try {
    const j = await (await fetch('/api/calibration')).json();
    if (j.ok && j.art) ART = j.art;    if (j.ok) FLIP = !!j.flip;  } catch (e) { /* サーバに届かない場合は後で既定値 */ }
  if (!ART) {
    ART = { left:   { x: 0.150, y: 0.204, w: 0.073, h: 0.104 },
            middle: { x: 0.308, y: 0.204, w: 0.077, h: 0.101 },
            right:  { x: 0.473, y: 0.207, w: 0.073, h: 0.096 } };
  }
}
function saveArt() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch('/api/calibration', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ art: ART, flip: FLIP })
    }).catch(() => {});
  }, 400);
}
function artRect(key, iw, ih) {
  const a = ART[key];
  return { x: a.x * iw, y: a.y * ih, w: a.w * iw, h: a.h * ih };
}
function toB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return btoa(s);
}
function extract(src, r) {
  const mid = document.createElement('canvas');
  mid.width = PW * 4; mid.height = PH * 4;
  const mc = mid.getContext('2d', { willReadFrequently: true });
  mc.imageSmoothingEnabled = true; mc.imageSmoothingQuality = 'high';
  mc.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, mid.width, mid.height);

  const gc = document.createElement('canvas');
  gc.width = PW; gc.height = PH;
  const g2 = gc.getContext('2d', { willReadFrequently: true });
  g2.imageSmoothingQuality = 'high';
  g2.drawImage(mid, 0, 0, PW, PH);
  const gd = g2.getImageData(0, 0, PW, PH).data;
  const gray = new Uint8Array(PW * PH);
  for (let i = 0, j = 0; i < gd.length; i += 4, j++) {
    gray[j] = (0.299 * gd[i] + 0.587 * gd[i + 1] + 0.114 * gd[i + 2]) | 0;
  }

  const cc = document.createElement('canvas');
  cc.width = CW; cc.height = CH;
  const c2 = cc.getContext('2d', { willReadFrequently: true });
  c2.imageSmoothingQuality = 'high';
  c2.drawImage(mid, 0, 0, CW, CH);
  const cd = c2.getImageData(0, 0, CW, CH).data;
  const color = new Uint8Array(CW * CH * 3);
  for (let i = 0, j = 0; i < cd.length; i += 4) {
    color[j++] = cd[i]; color[j++] = cd[i + 1]; color[j++] = cd[i + 2];
  }

  const pv = document.createElement('canvas');
  pv.width = 192; pv.height = 128;
  pv.getContext('2d').drawImage(src, r.x, r.y, r.w, r.h, 0, 0, 192, 128);
  return { gray: toB64(gray), color: toB64(color),
           preview: pv.toDataURL('image/png'), grayArr: gray };
}
async function recognize(queries, hero, debug, correctId, arenaOnly) {
  const res = await fetch('/api/recognize', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ queries, hero, debug: !!debug,
                           correctId: correctId || '', arenaOnly: !!arenaOnly })
  });
  const j = await res.json().catch(() => ({ ok: false, error: 'HTTP ' + res.status }));
  if (!j.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}
const STATUS_LABEL = {
  ok: '一致', uncertain: '判定不確実',
  nomatch: '一致するカードを特定できませんでした', empty: '候補なし'
};
function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
/* ===================== 共通部ここまで ===================== */

const $ = id => document.getElementById(id);

function baseURL() {
  let s = $('host').value.trim().replace(/\/+$/, '');
  if (!s) return '';
  if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
  return s;
}
// 画面は常に最新を映す。判定はこの取得が終わってから走らせる。
const FRAME_MS = 1500;
const LOOP_MS = 5000;
let frameTimer = null, judgeTimer = null, busy = false;

function grabFrame() {
  return new Promise((res, rej) => {
    const b = baseURL();
    if (!b) { rej(new Error('接続先を入力してください。')); return; }
    const img = $('screen');
    const off = () => {
      img.removeEventListener('load', ok); img.removeEventListener('error', ng);
    };
    const ok = () => { off(); applyFlip(); res(); };
    const ng = () => { off(); rej(new Error('取得できません。')); };
    img.addEventListener('load', ok);
    img.addEventListener('error', ng);
    img.src = '/castframe?host=' + encodeURIComponent(b) + '&t=' + Date.now();
  });
}

function afterFrame() {
  $('ov').hidden = false;
  // 枠を作り直すとドラッグ中の指が外れるので、初回だけ組み立てる
  if (!$('ov').children.length) drawOverlay();
  else { updateArtPreview(); applyZoom(); }
}

function idleStatus() {
  $('status').textContent = '接続済み  ' + frameW() + '×' + frameH() +
    (FLIP ? '  （180°補正中）' : '') + ($('loop').checked ? '  ループ判定中' : '');
}

async function frameTick() {
  clearTimeout(frameTimer);
  if (!busy && !drag && baseURL()) {
    try {
      await grabFrame();
      afterFrame();
      if (!busy) idleStatus();
    } catch (e) {
      if (!busy) {
        $('status').textContent =
          '取得できません。IPとCast to Browserの配信を確認してください。';
      }
    }
  }
  // 映像を流し続けるのはループ判定中だけ。止まっている間は配信元に触らない
  if ($('loop').checked) frameTimer = setTimeout(frameTick, FRAME_MS);
}

function startFrames() {
  const v = $('host').value.trim();
  if (v) localStorage.setItem('arenaHost', v);
  frameTick();
}

// 長押しの保存メニューが出ると枠をドラッグできない
document.querySelector('.frame').addEventListener('contextmenu', e => e.preventDefault());

/// 3枚の枠を囲む範囲だけを拡大する。座標は getBoundingClientRect が
/// 変形後の値を返すので、ドラッグの計算はそのままで正しく動く。
function applyZoom() {
  const wrap = document.querySelector('.frame');
  const z = $('zoom');
  if (!ART || !$('zoomOn').checked || !frameW()) {
    z.style.transform = '';
    wrap.style.height = '';
    return;
  }
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  SLOTS.forEach(s => {
    const a = ART[s.key], m = manaRect(s.key);
    x0 = Math.min(x0, a.x, m.x); y0 = Math.min(y0, a.y, m.y);
    x1 = Math.max(x1, a.x + a.w, m.x + m.w);
    y1 = Math.max(y1, a.y + a.h, m.y + m.h);
  });
  const pad = 0.015;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(1, x1 + pad); y1 = Math.min(1, y1 + pad);
  const k = 1 / Math.max(x1 - x0, 0.02);
  z.style.transform = 'scale(' + k + ') translate(' + (-x0 * 100) + '%,' + (-y0 * 100) + '%)';
  wrap.style.height = (wrap.clientWidth * (frameH() / frameW()) * (y1 - y0) * k) + 'px';
}

function drawOverlay() {
  if (!ART) return;
  const sel = $('calSlot').value;
  $('ov').innerHTML = SLOTS.map(s => {
    const a = ART[s.key];
    return '<div class="box art' + (s.key === sel ? ' on' : '') + '" data-key="' + s.key +
      '" style="left:' + (a.x * 100) + '%;top:' + (a.y * 100) +
      '%;width:' + (a.w * 100) + '%;height:' + (a.h * 100) +
      '%"><i>' + s.label + '</i><u></u></div>';
  }).join('');
  bindDrag();
  updateArtPreview();
  applyZoom();
}

function updateArtPreview() {
  if (!ART || !frameW()) return;
  const src = frameSrc(), iw = frameW(), ih = frameH();
  $('artPrev').querySelectorAll('canvas').forEach((cv, i) => {
    const r = artRect(SLOTS[i].key, iw, ih);
    cv.width = 192; cv.height = 128;
    cv.getContext('2d').drawImage(src, r.x, r.y, r.w, r.h, 0, 0, 192, 128);
  });
}

let drag = null;
function bindDrag() {
  $('ov').querySelectorAll('.box.art').forEach(el => {
    el.addEventListener('pointerdown', ev => {
      const box = frameSrc().getBoundingClientRect();
      if (!box.width) return;
      const key = el.dataset.key;
      $('calSlot').value = key;
      drag = {
        key, box, from: Object.assign({}, ART[key]),
        mode: ev.target.tagName === 'U' ? 'size' : 'move',
        px: ev.clientX, py: ev.clientY
      };
      el.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    el.addEventListener('pointermove', ev => {
      if (!drag) return;
      const dx = (ev.clientX - drag.px) / drag.box.width;
      const dy = (ev.clientY - drag.py) / drag.box.height;
      const a = drag.from;
      const cl = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
      const rd = v => Math.round(v * 10000) / 10000;
      ART[drag.key] = drag.mode === 'move'
        ? { x: rd(cl(a.x + dx, 0, 1 - a.w)), y: rd(cl(a.y + dy, 0, 1 - a.h)), w: a.w, h: a.h }
        : { x: a.x, y: a.y,
            w: rd(cl(a.w + dx, 0.02, 1 - a.x)), h: rd(cl(a.h + dy, 0.02, 1 - a.y)) };
      saveArt(); syncCal();
      ev.preventDefault();
    });
    el.addEventListener('pointerup', () => { drag = null; });
  });
}

const ART_URL = id =>
  'https://art.hearthstonejson.com/v1/256x/' + encodeURIComponent(id) + '.jpg';

let LAST = [];    // 直近の判定結果（スロットごと）
let LAST_HERO = ''; // その判定で使ったクラス。後から変えても表示とデータをずらさない
let CANDS = [];   // スロットごとの候補一覧
let PICKED = [];  // スロットごとに確定したカード

function pct(v) { return v === null || v === undefined ? '—' : v.toFixed(1) + '%'; }

const CLASS_JA = {
  DEATHKNIGHT: 'デスナイト', DEMONHUNTER: 'デモンハンター', DRUID: 'ドルイド',
  HUNTER: 'ハンター', MAGE: 'メイジ', PALADIN: 'パラディン', PRIEST: 'プリースト',
  ROGUE: 'ローグ', SHAMAN: 'シャーマン', WARLOCK: 'ウォーロック', WARRIOR: 'ウォリアー'
};

/// サイトの Deck Winrate は win。見比べられるようこれを太字で出す
function wrRow(label, a, strong) {
  if (!a) return '';
  const low = a.win !== null && a.win !== undefined && a.win < 50;
  return '<div class="wrRow' + (strong ? ' strong' : '') + (low ? ' low' : '') + '">' +
    '<span class="wrLab">' + esc(label) + '</span>' +
    '<span>デッキ <b>' + pct(a.win) + '</b></span>' +
    '<span>引いた時 ' + pct(a.drawn) + '</span>' +
    '<span>ピック ' + pct(a.pop) + '</span>' +
    (a.games ? '<span><small>(' + a.games.toLocaleString() + '戦)</small></span>' : '') +
    '</div>';
}

function wrHTML(c) {
  const hero = LAST_HERO;
  const rows = wrRow('全体', c.arenaAll, !hero) +
    (hero ? wrRow(CLASS_JA[hero] || hero, c.arenaClass, true) : '');
  return '<div class="wr">' + (rows || 'アリーナの勝率データなし') + '</div>';
}

function pickOf(c) {
  return { cardId: c.cardId, name: c.name, arena: c.arena,
           arenaAll: c.arenaAll, arenaClass: c.arenaClass };
}

function renderCards() {
  // デッキ勝率の降順。データが無いスロットは末尾へ送る
  const wr = i => {
    const a = PICKED[i] && PICKED[i].arena;
    return a && a.win !== null && a.win !== undefined ? a.win : -1;
  };
  const rank = [];
  LAST.map((_, i) => i).sort((a, b) => wr(b) - wr(a))
    .forEach((slot, pos) => { rank[slot] = pos; });

  $('cards').innerHTML = LAST.map((r, i) => {
    const sel = PICKED[i];
    // 一致しなくても候補は出す。誤判定でも手で選び直せる方が役に立つ
    const list = (r.candidates || []).slice(0, 5).map(c =>
      '<li data-slot="' + i + '" data-id="' + esc(c.cardId) + '"' +
      (sel && sel.cardId === c.cardId ? ' class="pick"' : '') + '>' +
      '<span class="nm">' + esc(c.name) + '</span>' +
      '<span class="sc">' + (c.arena ? pct(c.arena.win) : '—') + '</span>' +
      '<span class="sc">' + c.finalScore.toFixed(3) + '</span></li>').join('');
    return '<section class="card" style="--rank:' + rank[i] + '"><h2>' + SLOTS[i].label +
      (r.detectedCost !== null && r.detectedCost !== undefined
        ? ' <span class="mana">' + r.detectedCost + '</span>' : '') + '</h2>' +
      (sel ? '<div class="hit"><img src="' + ART_URL(sel.cardId) + '" alt="" loading="lazy">' +
        '<div class="meta"><div class="nm2">' + esc(sel.name) + '</div>' +
        wrHTML(sel) + '</div></div>' : '') +
      '<div class="badge ' + r.status + '">' + STATUS_LABEL[r.status] + '</div>' +
      '<ol class="cands">' + list + '</ol>' +
      '<input class="find" data-slot="' + i + '" placeholder="違うときはカード名で検索">' +
      '<ul class="found" data-slot="' + i + '"></ul></section>';
  }).join('');
  bindPicks();
  bindFind();
  updateGo();
}

async function judge() {
  if (busy) return;
  if (!baseURL()) { $('status').textContent = '接続先を入力してください。'; return; }
  busy = true;
  try {
    $('status').textContent = '最新画像を取得中…';
    await grabFrame();
    afterFrame();
    const src = frameSrc(), iw = frameW(), ih = frameH();
    if (!iw) throw new Error('画像を取得できませんでした。');
    $('status').textContent = '判定中…';
    const qs = SLOTS.map(s => {
      const r = artRect(s.key, iw, ih);
      const e = extract(src, r);
      const m = extractMana(src, manaRect(s.key, iw, ih), iw, ih);
      return { key: s.key, gray: e.gray, color: e.color, mana: m };
    });
    const res = await recognize(qs, $('hero').value, false, '',
                                $('arenaOnly').checked);
    LAST_HERO = $('hero').value;
    LAST = res.results;
    CANDS = res.results.map(r => r.candidates || []);
    PICKED = CANDS.map(cs => cs[0] ? pickOf(cs[0]) : null);
    renderCards();
    const pool = res.results[0] ? res.results[0].poolSize : 0;
    $('status').textContent = '完了  ' + pool + ' 枚から照合' +
      ($('loop').checked ? '  ループ判定中' : '');
  } catch (e) {
    $('status').textContent = 'エラー: ' + e.message;
  } finally {
    busy = false;
  }
}

/// 闘技場ページの #text= はカンマ区切りで複数指定できる
const HS_URL = 'https://hsreplay.net/ja/arena/cards/#text=';
const HS_SUFFIX = '&view=advanced';

function hsLink() {
  const names = PICKED.filter(Boolean).map(p => p.name);
  if (!names.length) return '';
  const hero = LAST_HERO;
  return HS_URL + encodeURIComponent(names.join(',')) +
    (hero ? '&playerClass=' + encodeURIComponent(hero) : '') + HS_SUFFIX;
}

function bindPicks() {
  $('cards').querySelectorAll('.cands li').forEach(li => {
    li.onclick = () => {
      const s = +li.dataset.slot;
      const c = (CANDS[s] || []).find(x => x.cardId === li.dataset.id);
      if (!c) return;
      PICKED[s] = pickOf(c);
      renderCards();
    };
  });
}

function bindFind() {
  $('cards').querySelectorAll('input.find').forEach(inp => {
    let timer = null;
    inp.oninput = () => {
      clearTimeout(timer);
      const s = +inp.dataset.slot;
      const ul = $('cards').querySelector('ul.found[data-slot="' + s + '"]');
      const term = inp.value.trim();
      if (!term) { ul.innerHTML = ''; return; }
      timer = setTimeout(async () => {
        try {
          const u = '/api/cards?q=' + encodeURIComponent(term) +
            '&hero=' + encodeURIComponent(LAST_HERO) +
            '&arenaOnly=' + ($('arenaOnly').checked ? '1' : '0');
          const j = await (await fetch(u)).json();
          const cards = j.cards || [];
          ul.innerHTML = cards.map(c =>
            '<li data-id="' + esc(c.cardId) + '">' +
            '<img src="' + ART_URL(c.cardId) + '" alt="" loading="lazy">' +
            '<span class="nm">' + esc(c.name) + '</span>' +
            '<span class="sc">' + (c.arena ? pct(c.arena.drawn) : '—') +
            '</span></li>').join('') ||
            '<li style="cursor:default;color:#6e7781">見つかりません</li>';
          ul.querySelectorAll('li[data-id]').forEach(li => {
            li.onclick = () => {
              const c = cards.find(x => x.cardId === li.dataset.id);
              if (!c) return;
              PICKED[s] = pickOf(c);
              renderCards();
            };
          });
        } catch (e) { ul.innerHTML = ''; }
      }, 250);
    };
  });
}

function updateGo() {
  const names = PICKED.filter(Boolean).map(p => p.name);
  $('go').style.display = names.length ? 'block' : 'none';
  $('picked').textContent = names.length
    ? names.join('、') + '（候補をタップ、または検索で入れ替えられます）'
    : '';
}

$('go').onclick = () => {
  const u = hsLink();
  if (u) window.open(u, '_blank');
};

function syncCal() {
  const a = ART[$('calSlot').value];
  [['ax', a.x], ['ay', a.y], ['aw', a.w], ['ah', a.h]].forEach(([id, v]) => {
    $(id).value = v * 100;
    $(id + 'v').textContent = (v * 100).toFixed(1);
  });
  drawOverlay();
}
['ax', 'ay', 'aw', 'ah'].forEach(id => $(id).addEventListener('input', () => {
  ART[$('calSlot').value] = {
    x: +$('ax').value / 100, y: +$('ay').value / 100,
    w: +$('aw').value / 100, h: +$('ah').value / 100
  };
  saveArt(); syncCal();
}));
$('calSlot').onchange = syncCal;
$('zoomOn').onchange = applyZoom;
window.addEventListener('resize', applyZoom);
$('flip').onchange = () => {
  FLIP = $('flip').checked;
  applyFlip();
  saveArt();
  if (frameW()) {
    $('status').textContent = '接続済み  ' + frameW() + '×' + frameH() +
      (FLIP ? '  （180°補正中）' : '');
  }
};
$('copyAll').onclick = () => {
  // 大きさだけ揃える。X はカードごとに違うので維持する。
  const a = ART[$('calSlot').value];
  SLOTS.forEach(s => { ART[s.key] = { x: ART[s.key].x, y: a.y, w: a.w, h: a.h }; });
  saveArt(); syncCal();
};
$('resetCal').onclick = async () => {
  await fetch('/api/calibration', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ art: {} })
  }).catch(() => {});
  ART = null;
  await loadArt();
  syncCal();
};
$('connect').onclick = startFrames;
$('judge').onclick = judge;
$('quit').onclick = async () => {
  if (!confirm('認識サーバを停止します。よろしいですか？')) return;
  clearTimeout(frameTimer); clearTimeout(judgeTimer);
  $('loop').checked = false;
  // プロセスが落ちるので応答が途切れることがある。失敗でも停止扱いとする
  try { await fetch('/api/shutdown', { method: 'POST' }); } catch (e) { /* noop */ }
  $('status').textContent = 'サーバを停止しました。a-Shell で python3 start.py を再実行してください。';
};
$('hero').onchange = () => localStorage.setItem('arenaHero', $('hero').value);
$('arenaOnly').onchange = () =>
  localStorage.setItem('arenaOnly', $('arenaOnly').checked ? '1' : '0');

function loopTick() {
  clearTimeout(judgeTimer);
  if (!$('loop').checked) return;
  judge().finally(() => {
    if ($('loop').checked) judgeTimer = setTimeout(loopTick, LOOP_MS);
  });
}
$('loop').onchange = () => {
  localStorage.setItem('arenaLoop', $('loop').checked ? '1' : '0');
  clearTimeout(judgeTimer);
  clearTimeout(frameTimer);
  if ($('loop').checked) { frameTick(); loopTick(); }
  else if (frameW()) idleStatus();
};

$('host').value = localStorage.getItem('arenaHost') || '';
$('hero').value = localStorage.getItem('arenaHero') || '';
$('arenaOnly').checked = localStorage.getItem('arenaOnly') !== '0';
$('loop').checked = localStorage.getItem('arenaLoop') === '1';

loadArt().then(() => {
  $('flip').checked = FLIP;
  syncCal();
  startFrames();
  if ($('loop').checked) judgeTimer = setTimeout(loopTick, LOOP_MS);
});

fetch('/api/info').then(r => r.json()).then(j => {
  $('info').textContent = j.ok
    ? 'DB ' + j.cards + ' 枚 / 変種 ' + j.variants + ' 通り / Stage1 ' + j.stage1Keep +
      ' 枚' + (j.arena ? ' / アリーナ対象 ' + j.arena.total + ' 枚' : ' / アリーナ統計なし')
    : j.error;
  if (!j.ok) {
    $('alert').textContent = j.error;
    $('alert').style.display = 'block';
  }
}).catch(() => {
  $('alert').innerHTML = '認識サーバに届いていません。このページは <code>start.py</code> 経由で開いてください。<br>' +
    '現在の URL：<code>' + esc(location.href) + '</code><br>' +
    '正しい URL：<code>http://localhost:8080/arena_assistant.html</code>';
  $('alert').style.display = 'block';
});
</script>
