<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arena Assistant</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0d1117;color:#f0f3f6}
main{max-width:1000px;margin:auto;padding:16px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
h1{font-size:22px;margin:0}
a{color:#58a6ff}
.row{display:flex;gap:8px;margin:10px 0}
input,select,button{font:inherit;border-radius:10px;border:1px solid #3d444d;padding:11px}
input,select{background:#151b23;color:#fff;min-width:0}
input[type=text],input:not([type]){flex:1}
button{background:#21262d;color:#f0f3f6;font-weight:700;cursor:pointer}
button.primary{background:#238636;border-color:#238636;flex:1}
button.danger{background:#2d1618;border-color:#a4232a;color:#ffb4b0;font-weight:400}
.status{font-size:13px;color:#9da7b3;min-height:20px;padding:4px 2px}
.frame{position:relative;background:#000;border-radius:12px;overflow:hidden;margin-top:8px;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#screen,#view{display:block;width:100%;height:auto;min-height:120px;
  pointer-events:none;-webkit-touch-callout:none;-webkit-user-drag:none}
#view[hidden],#screen[hidden]{display:none}
#zoom{position:relative;transform-origin:0 0}
#ov{position:absolute;inset:0;pointer-events:none}
.box{position:absolute;border:2px solid rgba(240,136,62,.55);border-radius:3px}
.box.art{border-color:#3fb950;border-width:2px;pointer-events:auto;cursor:move;touch-action:none}
.box.art.on{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.35)}
.box.art i{position:absolute;top:-16px;left:-2px;font-style:normal;font-size:10px;
  background:#3fb950;color:#000;padding:0 4px;border-radius:3px}
.box.art u{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;
  background:#3fb950;border:2px solid #0d1117;border-radius:50%;
  cursor:nwse-resize;touch-action:none}
.box.mana{border-color:#1f6feb;border-style:dashed}
.box.win{border-color:#58a6ff;border-width:2px;border-radius:50%/42%;
  box-shadow:0 0 0 1px rgba(13,17,23,.6) inset}
.artPrev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.artPrev figure{margin:0}
.artPrev figcaption{font-size:11px;color:#9da7b3;text-align:center;margin-bottom:4px}
.artPrev canvas{width:100%;height:auto;border-radius:7px;border:1px solid #30363d;
  background:#000;display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
/* 画像のすぐ下に出す簡易版。狭い画面でも3枚を横に並べたままにする */
.quick{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.quick.on{display:grid}
.quick .q{display:flex;flex-direction:column;gap:6px;min-width:0;
  background:#151b23;border:1px solid #30363d;border-radius:10px;padding:8px}
.quick .qh{display:flex;align-items:center;gap:6px;font-size:11px;color:#9da7b3}
.quick .qh .dot{width:7px;height:7px;border-radius:50%;flex:none;background:#3fb950}
.quick .qh .dot.uncertain{background:#d29922}
.quick .qh .dot.nomatch{background:#f85149}
.quick .qn{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.quick .qw{font-size:12px;color:#9da7b3;line-height:1.5;
  font-variant-numeric:tabular-nums}
.quick .qw div{display:flex;justify-content:space-between;gap:4px}
.quick .qw b{color:#3fb950;font-weight:700}
.quick .qw .low b{color:#f85149}
.quick .qw .lab{color:#6e7781;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick button{margin-top:auto;padding:9px 4px;font-size:13px;
  background:#1f6feb;border-color:#1f6feb}
.quick button.done{background:#21262d;border-color:#30363d;color:#9da7b3}
.card{background:#151b23;border:1px solid #30363d;border-radius:12px;padding:10px}
.card h2{font-size:13px;margin:0 0 8px;color:#9da7b3}
.card h2 .mana{display:inline-block;background:#1f6feb;color:#fff;border-radius:50%;
  width:18px;height:18px;line-height:18px;text-align:center;font-size:11px}
.card img.q{width:100%;border-radius:6px;display:block;background:#000}
.opts{flex-wrap:wrap;align-items:center}
.hit{display:flex;gap:10px;align-items:center;margin:0 0 8px}
.hit img{width:88px;height:auto;border-radius:6px;background:#000;flex:none}
.hit .meta{min-width:0;flex:1}
.hit .nm2{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr{font-size:12px;color:#9da7b3;margin-top:4px;line-height:1.5}
.wrRow{display:flex;flex-wrap:wrap;gap:0 8px}
.wrRow .wrLab{min-width:5.5em;color:#6e7781}
.wrRow.strong{color:#f0f3f6}
.wrRow b{color:#3fb950;font-variant-numeric:tabular-nums;font-size:13px}
.wrRow.low b{color:#f85149}
.wr small{opacity:.65}
input.find{width:100%;margin-top:9px;padding:8px 10px;font-size:13px}
.found{list-style:none;margin:6px 0 0;padding:0;max-height:210px;overflow:auto}
.found li{display:flex;gap:8px;align-items:center;padding:5px 0;
  border-top:1px solid #21262d;cursor:pointer;font-size:13px}
.found li img{width:44px;height:auto;border-radius:4px;background:#000;flex:none}
.badge{display:inline-block;margin:8px 0 6px;font-size:11px;padding:3px 8px;border-radius:20px}
.badge.ok{background:#12301c;color:#3fb950;border:1px solid #238636}
.badge.uncertain{background:#2b2411;color:#d29922;border:1px solid #9e6a03}
.badge.nomatch{background:#2d1618;color:#f85149;border:1px solid #a4232a}
.cands{list-style:none;margin:0;padding:0;counter-reset:r}
.cands li{display:flex;justify-content:space-between;gap:6px;font-size:13px;
  padding:5px 0;border-top:1px solid #21262d}
.cands li:first-child{border-top:0;font-weight:700}
.cands li::before{counter-increment:r;content:counter(r) ".";color:#6e7781;margin-right:4px}
.cands li{cursor:pointer}
.cands li.pick{color:#58a6ff}
#go{display:none;width:100%;background:#1f6feb;border-color:#1f6feb;margin:2px 0 4px;padding:14px}
#picked{font-size:13px;color:#9da7b3;margin-bottom:6px;line-height:1.7}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{color:#9da7b3;font-variant-numeric:tabular-nums}
details{margin-top:14px;background:#151b23;border:1px solid #30363d;border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:700}
.calibGrid{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:10px}
.calibGrid input{padding:0}
.calibGrid b{font-variant-numeric:tabular-nums;font-size:12px;min-width:42px;text-align:right}
.hint{font-size:12px;color:#9da7b3;line-height:1.6}
.flipRow{display:flex;align-items:center;gap:8px;font-size:13px;color:#f0f3f6}
#alert{display:none;background:#2d1618;border:1px solid #a4232a;color:#ffb4b0;
  border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14px;line-height:1.7}
#alert code{background:#0d1117;padding:2px 6px;border-radius:4px}
button.add{width:100%;margin-top:8px;padding:9px;font-size:13px;
  background:#1f6feb;border-color:#1f6feb}
#deckBox{margin-top:14px;background:#151b23;border:1px solid #30363d;
  border-radius:12px;padding:10px 12px}
#deckHead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
#deckHead h2{font-size:14px;margin:0}
#deckTotal{color:#9da7b3;font-size:13px}
#deckSort{margin-left:auto;padding:6px 8px;font-size:12px}
#deckClear{padding:6px 10px;font-size:12px}
#deckList{list-style:none;margin:0;padding:0}
#deckList li{display:flex;gap:8px;align-items:center;padding:5px 0;
  border-top:1px solid #21262d;font-size:13px}
#deckList li:first-child{border-top:0}
#deckList li.empty{color:#6e7781;justify-content:center;padding:14px 0}
#deckList img{width:40px;height:auto;border-radius:4px;background:#000;flex:none}
#deckList .cost{flex:none;min-width:20px;height:20px;line-height:20px;text-align:center;
  background:#1f6feb;color:#fff;border-radius:50%;font-size:11px}
#deckList .cnt{color:#58a6ff}
#deckList .tok{background:#2b2411;color:#d29922;border:1px solid #9e6a03;
  border-radius:4px;padding:0 5px;font-size:10px;white-space:nowrap}
#deckList .del{padding:3px 11px;font-size:14px;line-height:1.3}
#deckList img{cursor:zoom-in}
#deckFilter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#deckFilter button{padding:4px 10px;font-size:12px;font-weight:400;border-radius:20px}
#deckFilter button.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
#deckFilter .clr{color:#9da7b3}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px}
#shade.on{display:flex}
#shade img{max-width:min(90vw,420px);max-height:90vh;width:auto;height:auto;
  border-radius:10px}
@media(max-width:620px){
  .cards{grid-template-columns:1fr}
  /* 1列のときだけ勝率順に並べ替える。3列表示では左右の位置を保つ */
  .card{order:var(--rank,0)}
  /* 簡易版は3列のまま。狭い幅に収まるよう字だけ詰める */
  .quick{gap:5px}
  .quick .q{padding:6px 5px;gap:4px}
  .quick .qn{font-size:12px}
  .quick .qw{font-size:10px}
  .quick button{padding:9px 2px;font-size:12px}
}
</style>
</head>
<body>
<main>
<header>
  <h1>Arena Assistant</h1>
  <a href="arena_test.html">検証ページ</a>
</header>

<div id="alert"></div>

<div class="row">
  <input id="host" placeholder="192.168.11.6 または http://192.168.11.6">
  <button id="connect">接続</button>
</div>

<div class="row">
  <select id="hero" aria-label="クラス">
    <option value="">全クラス</option>
    <option>DEATHKNIGHT</option><option>DEMONHUNTER</option><option>DRUID</option>
    <option>HUNTER</option><option>MAGE</option><option>PALADIN</option>
    <option>PRIEST</option><option>ROGUE</option><option>SHAMAN</option>
    <option>WARLOCK</option><option>WARRIOR</option>
  </select>
  <button id="judge" class="primary">判定</button>
</div>

<div class="row opts">
  <label class="flipRow"><input type="checkbox" id="loop">ループ判定（5秒ごと）</label>
  <label class="flipRow"><input type="checkbox" id="arenaOnly" checked>アリーナ対象のみ</label>
</div>

<div id="status" class="status">接続先を入力してください。</div>

<div id="quick" class="quick"></div>

<section id="deckBox">
  <div id="deckHead">
    <h2>保存したカード</h2>
    <span id="deckTotal"></span>
    <select id="deckSort" aria-label="並び順">
      <option value="winDesc">勝率が高い順</option>
      <option value="winAsc">勝率が低い順</option>
      <option value="costDesc">マナが高い順</option>
      <option value="costAsc">マナが低い順</option>
      <option value="tag">種別順</option>
    </select>
    <button id="deckClear" class="danger">一括削除</button>
  </div>
  <div id="deckFilter"></div>
  <ul id="deckList"></ul>
</section>

<div class="frame">
  <div id="zoom">
    <img id="screen" alt="">
    <canvas id="view" hidden></canvas>
    <div id="ov" hidden></div>
  </div>
</div>

<div id="cards" class="cards"></div>

<button id="go">HSReplay で3枚の勝率を見る</button>
<div id="picked"></div>

<div id="shade"><img alt=""></div>

<details>
  <summary>切り取り範囲の調整</summary>
  <p class="hint"><b>緑の枠はカード全体</b>です。カードの外周に合わせてください。
  <b>枠をドラッグで移動、右下の丸でサイズ変更</b>。
  アートの形はミニオン＝縦長の楕円、呪文＝横長の角丸、武器＝円と種別ごとに
  違うので、絵ではなくカードの外枠に合わせます。実際に照合した範囲は
  判定後に<b>青い枠</b>で出ます。多少ずれてもサーバが枠の絵を手がかりに
  合わせ直すので、おおよそで構いません。
  設定はサーバに保存され、検証ページと共有されます。</p>
  <div class="calibGrid">
    <span>X %</span><input type="range" id="ax" min="0" max="95" step="0.1"><b id="axv"></b>
    <span>Y %</span><input type="range" id="ay" min="0" max="95" step="0.1"><b id="ayv"></b>
    <span>幅 %</span><input type="range" id="aw" min="2" max="100" step="0.1"><b id="awv"></b>
    <span>高さ %</span><input type="range" id="ah" min="2" max="100" step="0.1"><b id="ahv"></b>
  </div>
  <div class="row">
    <label class="flipRow"><input type="checkbox" id="zoomOn" checked>
      カード部分だけを拡大して調整する</label>
  </div>
  <div class="row">
    <label class="flipRow"><input type="checkbox" id="flip" checked>
      配信が上下逆のときに ON（180°補正）</label>
  </div>
  <div class="row">
    <select id="calSlot" aria-label="調整する枠">
      <option value="left">左の枠</option>
      <option value="middle">中央の枠</option>
      <option value="right">右の枠</option>
    </select>
    <button id="fitRatio">カードの比率に合わせる</button>
    <button id="copyAll">この枠を3枚に適用</button>
    <button id="resetCal">初期値に戻す</button>
  </div>
  <div class="artPrev" id="artPrev">
    <figure><figcaption>左</figcaption><canvas></canvas></figure>
    <figure><figcaption>中央</figcaption><canvas></canvas></figure>
    <figure><figcaption>右</figcaption><canvas></canvas></figure>
  </div>
</details>

<div class="row">
  <button id="quit" class="danger">サーバを停止</button>
</div>

<p class="hint" id="info"></p>
</main>

<script>
/* ==========================================================================
   共通部（arena_test.html と同じ内容を保つこと）
   ========================================================================== */
const SLOTS = [
  { key: 'left', label: '左' },
  { key: 'middle', label: '中央' },
  { key: 'right', label: '右' }
];
// サーバ側の CARD_W/CARD_H・CARD_MARGIN と一致させること
const CARD_W = 152, CARD_H = 230, CARD_CW = 38, CARD_CH = 58, CARD_MARGIN = 0.15;
// 旧方式（長方形ひとつ）との比較用。サーバの PW/PH, GW*2/GH*2 と揃える
const PW = 48, PH = 32, CW = 12, CH = 8;
const CARD_ASPECT = 256 / 388;   // カードの縦横比は種別に関係なく一定

// 切り取り枠はカード全体。アートの形はミニオン＝縦長の楕円、呪文＝横長の角丸、
// 武器＝円と種別ごとに違うので「絵に合わせる」では合わせようがない。
// カードの外枠なら種別に関係なく一意に決まり、そこからアート窓もマナ結晶も
// サーバが実測値で割り出す。少しずれても枠テンプレートで合わせ直す。
let CARD = null;
let SHAPES = {};
let GEM_REL = { x: 0.020, y: 0.040, w: 0.215, h: 0.175 };
let GEM_PAD = [-0.10, -0.08, 0.34, 0.34];
let GEM_W = 96, GEM_H = 120;
let saveTimer = null;

// 配信が 180° ひっくり返る場合の補正。表示も切り出しもこの補正後の画像を見る。
let FLIP = true;

function applyFlip() {
  const img = $('screen'), cv = $('view');
  if (!img.naturalWidth) return;
  if (FLIP) {
    cv.width = img.naturalWidth;
    cv.height = img.naturalHeight;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.setTransform(1, 0, 0, 1, 0, 0);
    cx.translate(cv.width, cv.height);
    cx.rotate(Math.PI);
    cx.drawImage(img, 0, 0);
    cx.setTransform(1, 0, 0, 1, 0, 0);
  }
  cv.hidden = !FLIP;
  img.hidden = FLIP;
}

function frameSrc() {
  return FLIP ? $('view') : $('screen');
}
function frameW() {
  const s = frameSrc();
  return s.naturalWidth || s.width;
}
function frameH() {
  const s = frameSrc();
  return s.naturalHeight || s.height;
}

async function loadCal() {
  try {
    const j = await (await fetch('/api/calibration')).json();
    if (j.ok) {
      if (j.card) CARD = j.card;
      if (j.shapes) SHAPES = j.shapes;
      if (j.gemRel) GEM_REL = j.gemRel;
      if (j.gemPad) GEM_PAD = j.gemPad;
      if (j.gemPatch) { GEM_W = j.gemPatch[0]; GEM_H = j.gemPatch[1]; }
      FLIP = !!j.flip;
    }
  } catch (e) { /* サーバに届かない場合は後で既定値 */ }
  if (!CARD) {
    CARD = { left:   { x: 0.113, y: 0.175, w: 0.150, h: 0.271 },
             middle: { x: 0.269, y: 0.176, w: 0.158, h: 0.263 },
             right:  { x: 0.436, y: 0.180, w: 0.150, h: 0.250 } };
  }
}
function saveCal() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch('/api/calibration', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ card: CARD, flip: FLIP })
    }).catch(() => {});
  }, 400);
}
function cardRect(key, iw, ih) {
  const a = CARD[key];
  return { x: a.x * (iw || 1), y: a.y * (ih || 1),
           w: a.w * (iw || 1), h: a.h * (ih || 1) };
}
// サーバが枠テンプレートで合わせ直せるよう、まわりに余白を付けて送る
function grabRect(key, iw, ih) {
  const a = CARD[key], m = CARD_MARGIN;
  return { x: (a.x - m * a.w) * (iw || 1), y: (a.y - m * a.h) * (ih || 1),
           w: a.w * (1 + 2 * m) * (iw || 1), h: a.h * (1 + 2 * m) * (ih || 1) };
}
// カード枠に対する相対矩形(0..1)をフレーム比率へ直す
function relRect(key, r, iw, ih) {
  const a = CARD[key];
  return { x: (a.x + r[0] * a.w) * (iw || 1), y: (a.y + r[1] * a.h) * (ih || 1),
           w: (r[2] - r[0]) * a.w * (iw || 1),
           h: (r[3] - r[1]) * a.h * (ih || 1) };
}
function artWin(key, type, iw, ih) {
  const s = SHAPES[type] || SHAPES.MINION;
  return s ? relRect(key, [s.u0, s.v0, s.u1, s.v1], iw, ih) : null;
}
function gemRect(key, iw, ih) {
  return relRect(key, [GEM_REL.x, GEM_REL.y, GEM_REL.x + GEM_REL.w,
                       GEM_REL.y + GEM_REL.h], iw, ih);
}
// サーバが返す「合わせ直したあとの枠」はパッチ内の比率。フレーム比率へ戻す
function alignedRect(key, rect) {
  if (!rect) return null;
  const b = grabRect(key);
  return { x: b.x + rect[0] * b.w, y: b.y + rect[1] * b.h,
           w: rect[2] * b.w, h: rect[2] * b.h };
}
function alignedWin(key, win) {
  if (!win) return null;
  const b = grabRect(key);
  return { x: b.x + win[0] * b.w, y: b.y + win[1] * b.h,
           w: (win[2] - win[0]) * b.w, h: (win[3] - win[1]) * b.h };
}
function toB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return btoa(s);
}
function extractCard(src, r) {
  const mid = document.createElement('canvas');
  mid.width = CARD_W * 2; mid.height = CARD_H * 2;
  const mc = mid.getContext('2d', { willReadFrequently: true });
  mc.imageSmoothingEnabled = true; mc.imageSmoothingQuality = 'high';
  mc.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, mid.width, mid.height);

  const gc = document.createElement('canvas');
  gc.width = CARD_W; gc.height = CARD_H;
  const g2 = gc.getContext('2d', { willReadFrequently: true });
  g2.imageSmoothingQuality = 'high';
  g2.drawImage(mid, 0, 0, CARD_W, CARD_H);
  const gd = g2.getImageData(0, 0, CARD_W, CARD_H).data;
  const gray = new Uint8Array(CARD_W * CARD_H);
  for (let i = 0, j = 0; i < gd.length; i += 4, j++) {
    gray[j] = (0.299 * gd[i] + 0.587 * gd[i + 1] + 0.114 * gd[i + 2]) | 0;
  }

  const cc = document.createElement('canvas');
  cc.width = CARD_CW; cc.height = CARD_CH;
  const c2 = cc.getContext('2d', { willReadFrequently: true });
  c2.imageSmoothingQuality = 'high';
  c2.drawImage(mid, 0, 0, CARD_CW, CARD_CH);
  const cd = c2.getImageData(0, 0, CARD_CW, CARD_CH).data;
  const color = new Uint8Array(CARD_CW * CARD_CH * 3);
  for (let i = 0, j = 0; i < cd.length; i += 4) {
    color[j++] = cd[i]; color[j++] = cd[i + 1]; color[j++] = cd[i + 2];
  }
  return { card: toB64(gray), cardColor: toB64(color) };
}
// マナ結晶はカードの 0.2 ほどしかなく、カード全体のパッチ経由だと数字が潰れる。
// まわりを広めに原寸で送り、枠合わせの結果でサーバが切り直す。
function extractGem(src, key, iw, ih) {
  const r = relRect(key, GEM_PAD, iw, ih);
  const c = document.createElement('canvas');
  c.width = GEM_W; c.height = GEM_H;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high';
  cx.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, GEM_W, GEM_H);
  const d = cx.getImageData(0, 0, GEM_W, GEM_H).data;
  const g = new Uint8Array(GEM_W * GEM_H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    g[j] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;
  }
  return toB64(g);
}
function extract(src, r) {
  const mid = document.createElement('canvas');
  mid.width = PW * 4; mid.height = PH * 4;
  const mc = mid.getContext('2d', { willReadFrequently: true });
  mc.imageSmoothingEnabled = true; mc.imageSmoothingQuality = 'high';
  mc.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, mid.width, mid.height);

  const gc = document.createElement('canvas');
  gc.width = PW; gc.height = PH;
  const g2 = gc.getContext('2d', { willReadFrequently: true });
  g2.imageSmoothingQuality = 'high';
  g2.drawImage(mid, 0, 0, PW, PH);
  const gd = g2.getImageData(0, 0, PW, PH).data;
  const gray = new Uint8Array(PW * PH);
  for (let i = 0, j = 0; i < gd.length; i += 4, j++) {
    gray[j] = (0.299 * gd[i] + 0.587 * gd[i + 1] + 0.114 * gd[i + 2]) | 0;
  }

  const cc = document.createElement('canvas');
  cc.width = CW; cc.height = CH;
  const c2 = cc.getContext('2d', { willReadFrequently: true });
  c2.imageSmoothingQuality = 'high';
  c2.drawImage(mid, 0, 0, CW, CH);
  const cd = c2.getImageData(0, 0, CW, CH).data;
  const color = new Uint8Array(CW * CH * 3);
  for (let i = 0, j = 0; i < cd.length; i += 4) {
    color[j++] = cd[i]; color[j++] = cd[i + 1]; color[j++] = cd[i + 2];
  }

  const pv = document.createElement('canvas');
  pv.width = 192; pv.height = 128;
  pv.getContext('2d').drawImage(src, r.x, r.y, r.w, r.h, 0, 0, 192, 128);
  return { gray: toB64(gray), color: toB64(color),
           preview: pv.toDataURL('image/png'), grayArr: gray };
}

const FRAME_MS = 1500;

function grabFrame() {
  return new Promise((res, rej) => {
    const b = baseURL();
    if (!b) { rej(new Error('接続先を入力してください。')); return; }
    const img = $('screen');
    const off = () => {
      img.removeEventListener('load', ok); img.removeEventListener('error', ng);
    };
    const ok = () => { off(); applyFlip(); res(); };
    const ng = () => { off(); rej(new Error('取得できません。')); };
    img.addEventListener('load', ok);
    img.addEventListener('error', ng);
    img.src = '/castframe?host=' + encodeURIComponent(b) + '&t=' + Date.now();
  });
}

async function frameTick() {

/// 3枚の枠を囲む範囲だけを拡大する。座標は getBoundingClientRect が
/// 変形後の値を返すので、ドラッグの計算はそのままで正しく動く。
function applyZoom() {
  const wrap = document.querySelector('.frame');
  const z = $('zoom');
  if (!CARD || !$('zoomOn').checked || !frameW()) {
    z.style.transform = '';
    wrap.style.height = '';
    return;
  }
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  SLOTS.forEach(s => {
    const a = CARD[s.key];
    x0 = Math.min(x0, a.x); y0 = Math.min(y0, a.y);
    x1 = Math.max(x1, a.x + a.w); y1 = Math.max(y1, a.y + a.h);
  });
  const pad = 0.02;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(1, x1 + pad); y1 = Math.min(1, y1 + pad);
  const k = 1 / Math.max(x1 - x0, 0.02);
  z.style.transform = 'scale(' + k + ') translate(' + (-x0 * 100) + '%,' + (-y0 * 100) + '%)';
  wrap.style.height = (wrap.clientWidth * (frameH() / frameW()) * (y1 - y0) * k) + 'px';
}

let drag = null;
function bindDrag() {
  $('ov').querySelectorAll('.box.art').forEach(el => {
    el.addEventListener('pointerdown', ev => {
      const box = frameSrc().getBoundingClientRect();
      if (!box.width) return;
      const key = el.dataset.key;
      $('calSlot').value = key;
      drag = {
        key, box, from: Object.assign({}, CARD[key]),
        mode: ev.target.tagName === 'U' ? 'size' : 'move',
        px: ev.clientX, py: ev.clientY
      };
      el.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });
    el.addEventListener('pointermove', ev => {
      if (!drag) return;
      const dx = (ev.clientX - drag.px) / drag.box.width;
      const dy = (ev.clientY - drag.py) / drag.box.height;
      const a = drag.from;
      const cl = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
      const rd = v => Math.round(v * 10000) / 10000;
      CARD[drag.key] = drag.mode === 'move'
        ? { x: rd(cl(a.x + dx, 0, 1 - a.w)), y: rd(cl(a.y + dy, 0, 1 - a.h)), w: a.w, h: a.h }
        : { x: a.x, y: a.y,
            w: rd(cl(a.w + dx, 0.02, 1 - a.x)), h: rd(cl(a.h + dy, 0.02, 1 - a.y)) };
      saveCal(); syncCal();
      ev.preventDefault();
    });
    el.addEventListener('pointerup', () => { drag = null; });
  });
}

let DECK = { total: 0, cards: [] };

// カード種類・種族・呪文の周波数。DB の ctype / races / spell_school に対応する
const TAG_JA = {
  MINION: 'ミニオン', SPELL: '呪文', WEAPON: '武器', LOCATION: '場所', HERO: 'ヒーロー',
  BEAST: '獣', DRAGON: 'ドラゴン', ELEMENTAL: 'エレメンタル', UNDEAD: 'アンデッド',

  SHADOW: '影', NATURE: '自然', FIRE: '火', ARCANE: '秘術', HOLY: '神聖',
  FEL: '邪悪', FROST: '氷'
};
const TAG_ORDER = Object.keys(TAG_JA);
const tagJa = t => TAG_JA[t] || t;

const CARD_URL = id =>

function deckWin(c) {
  const a = c.arenaClass || c.arenaAll;
  return a && a.win !== null && a.win !== undefined ? a.win : null;
}

/// 選んだ種別のいずれかを持つカードを残す（OR 条件）
function filterDeck(cards) {
  if (!DECK_FILTER.length) return cards;
  return cards.filter(c =>
    (c.tags || []).some(t => DECK_FILTER.indexOf(t) >= 0));
}

function renderFilter() {
  const seen = {};
  (DECK.cards || []).forEach(c =>
    (c.tags || []).forEach(t => { seen[t] = (seen[t] || 0) + c.count; }));
  const keys = Object.keys(seen).sort(
    (a, b) => TAG_ORDER.indexOf(a) - TAG_ORDER.indexOf(b));
  $('deckFilter').innerHTML = keys.map(t =>
    '<button data-tag="' + esc(t) + '"' +
    (DECK_FILTER.indexOf(t) >= 0 ? ' class="on"' : '') + '>' +
    esc(tagJa(t)) + ' ' + seen[t] + '</button>').join('') +
    (DECK_FILTER.length ? '<button class="clr" data-tag="">解除</button>' : '');

  $('deckFilter').querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const t = b.dataset.tag;
      if (!t) DECK_FILTER = [];
      else {
        const i = DECK_FILTER.indexOf(t);
        if (i >= 0) DECK_FILTER.splice(i, 1); else DECK_FILTER.push(t);
      }
      renderDeck();
    };
  });
}

/// 値の無いカードはどの順序でも末尾へ送る
function sortDeck(cards) {
  const mode = $('deckSort').value;
  if (mode === 'tag') {
    const k = c => {
      const t = (c.tags || []).filter(x => TAG_ORDER.indexOf(x) > 4)[0] ||
        (c.tags || [])[0] || '';
      return TAG_ORDER.indexOf(t) < 0 ? 999 : TAG_ORDER.indexOf(t);
    };
    return cards.slice().sort((a, b) =>
      k(a) - k(b) || a.name.localeCompare(b.name, 'ja'));
  }
  const asc = mode === 'winAsc' || mode === 'costAsc';
  const key = mode.indexOf('cost') === 0
    ? (c => c.cost === null || c.cost === undefined ? null : c.cost)
    : deckWin;
  const v = c => {
    const x = key(c);
    return x === null ? (asc ? Infinity : -Infinity) : x;
  };
  return cards.slice().sort((a, b) =>
    (asc ? v(a) - v(b) : v(b) - v(a)) || a.name.localeCompare(b.name, 'ja'));
}

  if (!j.ok) throw new Error(j.error || '保存に失敗しました');

}

      '<button class="del" title="1枚減らす">−</button></li>';
  }).join('') ||
    '<li class="empty">' + (has ? '条件に合うカードがありません' : 'まだありません') + '</li>';

  $('deckList').querySelectorAll('li[data-id]').forEach(li => {
    li.querySelector('img').onclick = () => showCard(li.dataset.id);
    li.querySelector('.del').onclick = async () => {
      try {
        renderDeck(await deckCall({ action: 'remove', cardId: li.dataset.id }));
      } catch (e) { $('status').textContent = 'エラー: ' + e.message; }
    };
  });
}

$('deckSort').onchange = () => {
  localStorage.setItem('arenaDeckSort', $('deckSort').value);
  renderDeck();
};

async function addPick(slot, btn) {
  const p = PICKED[slot];
  if (!p) return;
  const label = btn ? btn.textContent : '';
  try {
    const d = await deckCall({ action: 'add', cardId: p.cardId, hero: LAST_HERO });
    renderDeck(d);
    if (btn) {
      btn.textContent = '保存しました';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = label; btn.classList.remove('done'); }, 1200);
    }
    $('status').textContent = d.added && d.added.length
      ? p.name + ' と、付属の ' + d.added.join('、') + ' を保存しました。'
      : p.name + ' を保存しました。';
  } catch (e) { $('status').textContent = 'エラー: ' + e.message; }
}

function bindAdd() {
  $('cards').querySelectorAll('button.add').forEach(b => {
    b.onclick = () => addPick(+b.dataset.slot, b);
  });
}

$('deckClear').onclick = async () => {
  if (!confirm('保存したカードをすべて削除します。よろしいですか？')) return;
  try {
    renderDeck(await deckCall({ action: 'clear' }));
  } catch (e) { $('status').textContent = 'エラー: ' + e.message; }
};

async function judge() {
  if (busy) return;
  if (!baseURL()) { $('status').textContent = '接続先を入力してください。'; return; }
  busy = true;
  try {
    $('status').textContent = '最新画像を取得中…';
    await grabFrame();
    afterFrame();
    const src = frameSrc(), iw = frameW(), ih = frameH();
    if (!iw) throw new Error('画像を取得できませんでした。');
    $('status').textContent = '判定中…';
    const qs = SLOTS.map(s => {
      const e = extractCard(src, grabRect(s.key, iw, ih));
      return { key: s.key, card: e.card, cardColor: e.cardColor,
               gem: extractGem(src, s.key, iw, ih) };
    });
    const res = await recognize(qs, $('hero').value, false, '',
                                $('arenaOnly').checked);
    LAST_HERO = $('hero').value;
    LAST = res.results;
    CANDS = res.results.map(r => r.candidates || []);
    PICKED = CANDS.map(cs => cs[0] ? pickOf(cs[0]) : null);
    renderCards();
    drawOverlay();
    const pool = res.results[0] ? res.results[0].poolSize : 0;
    $('status').textContent = '完了  ' + pool + ' 枚から照合' +
      ($('loop').checked ? '  ループ判定中' : '');
  } catch (e) {
    $('status').textContent = 'エラー: ' + e.message;
  } finally {
    busy = false;
  }
}

/// 闘技場ページの #text= はカンマ区切りで複数指定できる
const HS_URL = 'https://hsreplay.net/ja/arena/cards/#text=';
const HS_SUFFIX = '&view=advanced';

function hsLink() {
  const names = PICKED.filter(Boolean).map(p => p.name);
  if (!names.length) return '';
  const hero = LAST_HERO;
  return HS_URL + encodeURIComponent(names.join(',')) +
    (hero ? '&playerClass=' + encodeURIComponent(hero) : '') + HS_SUFFIX;
}

function bindPicks() {
  $('cards').querySelectorAll('.cands li').forEach(li => {
    li.onclick = () => {
      const s = +li.dataset.slot;
      const c = (CANDS[s] || []).find(x => x.cardId === li.dataset.id);
      if (!c) return;
      PICKED[s] = pickOf(c);
      renderCards();
    };
  });
}

function bindFind() {
  $('cards').querySelectorAll('input.find').forEach(inp => {
    let timer = null;
    inp.oninput = () => {
      clearTimeout(timer);
      const s = +inp.dataset.slot;
      const ul = $('cards').querySelector('ul.found[data-slot="' + s + '"]');
      const term = inp.value.trim();
      if (!term) { ul.innerHTML = ''; return; }
      timer = setTimeout(async () => {
        try {
          const u = '/api/cards?q=' + encodeURIComponent(term) +
            '&hero=' + encodeURIComponent(LAST_HERO) +
            '&arenaOnly=' + ($('arenaOnly').checked ? '1' : '0');
          const j = await (await fetch(u)).json();
          const cards = j.cards || [];
          ul.innerHTML = cards.map(c =>
            '<li data-id="' + esc(c.cardId) + '">' +
            '<img src="' + ART_URL(c.cardId) + '" alt="" loading="lazy">' +
            '<span class="nm">' + esc(c.name) + '</span>' +
            '<span class="sc">' + (c.arena ? pct(c.arena.drawn) : '—') +
            '</span></li>').join('') ||
            '<li style="cursor:default;color:#6e7781">見つかりません</li>';
          ul.querySelectorAll('li[data-id]').forEach(li => {
            li.onclick = () => {
              const c = cards.find(x => x.cardId === li.dataset.id);
              if (!c) return;
              PICKED[s] = pickOf(c);
              renderCards();
            };
          });
        } catch (e) { ul.innerHTML = ''; }
      }, 250);
    };
  });
}

function updateGo() {
  const names = PICKED.filter(Boolean).map(p => p.name);
  $('go').style.display = names.length ? 'block' : 'none';
  $('picked').textContent = names.length
    ? names.join('、') + '（候補をタップ、または検索で入れ替えられます）'
    : '';
}

$('go').onclick = () => {
  const u = hsLink();
  if (u) window.open(u, '_blank');
};

function syncCal() {
  const a = CARD[$('calSlot').value];
  [['ax', a.x], ['ay', a.y], ['aw', a.w], ['ah', a.h]].forEach(([id, v]) => {
    $(id).value = v * 100;
    $(id + 'v').textContent = (v * 100).toFixed(1);
  });
  drawOverlay();
}
['ax', 'ay', 'aw', 'ah'].forEach(id => $(id).addEventListener('input', () => {
  CARD[$('calSlot').value] = {
    x: +$('ax').value / 100, y: +$('ay').value / 100,
    w: +$('aw').value / 100, h: +$('ah').value / 100
  };
  saveCal(); syncCal();
}));
$('calSlot').onchange = syncCal;
$('zoomOn').onchange = applyZoom;
window.addEventListener('resize', applyZoom);
// カードの縦横比は 256:388 で決まっている。高さを幅に合わせて直す
$('fitRatio').onclick = () => {
  if (!frameW()) { $('status').textContent = '先に接続してください。'; return; }
  const k = $('calSlot').value, a = CARD[k];
  const h = a.w * (frameW() / frameH()) / CARD_ASPECT;
  CARD[k] = { x: a.x, y: a.y, w: a.w, h: Math.round(h * 10000) / 10000 };
  saveCal(); syncCal();
};
$('flip').onchange = () => {
  FLIP = $('flip').checked;
  applyFlip();
  saveCal();
  if (frameW()) {
    $('status').textContent = '接続済み  ' + frameW() + '×' + frameH() +
      (FLIP ? '  （180°補正中）' : '');
  }
};
$('copyAll').onclick = () => {
  // 大きさだけ揃える。X はカードごとに違うので維持する。
  const a = CARD[$('calSlot').value];
  SLOTS.forEach(s => { CARD[s.key] = { x: CARD[s.key].x, y: a.y, w: a.w, h: a.h }; });
  saveCal(); syncCal();
};
$('resetCal').onclick = async () => {
  await fetch('/api/calibration', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ card: {} })
  }).catch(() => {});
  CARD = null;
  await loadCal();
  syncCal();
};
$('connect').onclick = startFrames;
$('judge').onclick = judge;
$('quit').onclick = async () => {
  if (!confirm('認識サーバを停止します。よろしいですか？')) return;
  clearTimeout(frameTimer); clearTimeout(judgeTimer);
  $('loop').checked = false;
  // プロセスが落ちるので応答が途切れることがある。失敗でも停止扱いとする
  try { await fetch('/api/shutdown', { method: 'POST' }); } catch (e) { /* noop */ }
  $('status').textContent = 'サーバを停止しました。a-Shell で python3 start.py を再実行してください。';
};
$('hero').onchange = () => localStorage.setItem('arenaHero', $('hero').value);
$('arenaOnly').onchange = () =>
  localStorage.setItem('arenaOnly', $('arenaOnly').checked ? '1' : '0');

function loopTick() {
  clearTimeout(judgeTimer);
  if (!$('loop').checked) return;
  judge().finally(() => {
    if ($('loop').checked) judgeTimer = setTimeout(loopTick, LOOP_MS);
  });
}
$('loop').onchange = () => {
  localStorage.setItem('arenaLoop', $('loop').checked ? '1' : '0');
  clearTimeout(judgeTimer);
  clearTimeout(frameTimer);
  if ($('loop').checked) { frameTick(); loopTick(); }
  else if (frameW()) idleStatus();
};

$('host').value = localStorage.getItem('arenaHost') || '';
$('hero').value = localStorage.getItem('arenaHero') || '';
$('arenaOnly').checked = localStorage.getItem('arenaOnly') !== '0';
$('loop').checked = localStorage.getItem('arenaLoop') === '1';
$('deckSort').value = localStorage.getItem('arenaDeckSort') || 'winDesc';

// サーバは単一スレッド。起動時の問い合わせを並行させると互いに待たされるので
// 順番に片付け、最後に映像の取得を始める。
(async () => {
  try {
    renderDeck(await deckCall());
  } catch (e) {
    renderDeck({ total: 0, cards: [] });
  }

  try {
    const j = await (await fetch('/api/info')).json();
    $('info').textContent = j.ok
      ? 'DB ' + j.cards + ' 枚 / アート窓 ' + (j.shapes || []).join('・') +
        ' / Stage1 ' + j.stage1Keep +
        ' 枚' + (j.arena ? ' / アリーナ対象 ' + j.arena.total + ' 枚' : ' / アリーナ統計なし')
      : j.error;
    if (!j.ok) {
      $('alert').textContent = j.error;
      $('alert').style.display = 'block';
    } else if (!(j.shapes || []).length) {
      $('alert').innerHTML = '種別ごとのアート窓がまだありません。<br>' +
        '<code>python build_card_db.py --shapes</code> を実行してください。';
      $('alert').style.display = 'block';
    }
  } catch (e) {
    $('alert').innerHTML = '認識サーバに届いていません。このページは <code>start.py</code> 経由で開いてください。<br>' +
      '現在の URL：<code>' + esc(location.href) + '</code><br>' +
      '正しい URL：<code>http://localhost:8080/arena_assistant.html</code>';
    $('alert').style.display = 'block';
  }

  await loadCal();
  $('flip').checked = FLIP;
  syncCal();
  startFrames();
  if ($('loop').checked) judgeTimer = setTimeout(loopTick, LOOP_MS);
})();
</script>
</body>
</html>
