name: Build ArenaAssistant (iOS 27 SDK)

on:
  push:
    paths:
      - 'ArenaAssistant.swiftpm/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # 指定どおり xcode-27 を使う。
    # これは GitHub ホストの標準ラベルではないため、該当する runner が
    # 登録されていない場合ジョブは "Waiting for a runner" のまま進まない。
    # その場合は macos-26 などへ変更し、xcode-select で Xcode 27 を選ぶ。
    runs-on: xcode-27

    env:
      APP_DIR: ArenaAssistant.swiftpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. どのツールチェーンで動いているかをログに残す
      # ---------------------------------------------------------------
      - name: Toolchain versions
        run: |
          echo "::group::xcodebuild -version"
          xcodebuild -version
          echo "::endgroup::"

          echo "::group::iphoneos SDK"
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path
          echo "::endgroup::"

          echo "::group::swift --version"
          swift --version
          echo "::endgroup::"

          echo "::group::installed SDKs"
          xcodebuild -showsdks
          echo "::endgroup::"

      # ---------------------------------------------------------------
      # 2. iOS SDK が 27 系であることを確認する
      #    ここで止めないと、古い SDK で「import できた」と誤解しかねない
      # ---------------------------------------------------------------
      - name: Assert iOS SDK is 27.x
        run: |
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK version: ${SDK_VERSION}"
          case "${SDK_VERSION}" in
            27.*) echo "OK: iOS 27 SDK" ;;
            *)
              echo "::error::iOS 27 SDK が必要ですが ${SDK_VERSION} でした。runner の Xcode を確認してください。"
              exit 1
              ;;
          esac

      # ---------------------------------------------------------------
      # 3. SDK に ScreenCaptureKit が実在するかを確認する
      # ---------------------------------------------------------------
      - name: Check ScreenCaptureKit exists in the iOS SDK
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: ${SDK_PATH}"

          FRAMEWORK="${SDK_PATH}/System/Library/Frameworks/ScreenCaptureKit.framework"
          if [ -d "${FRAMEWORK}" ]; then
            echo "OK: ${FRAMEWORK}"
            ls -la "${FRAMEWORK}"
          else
            echo "::error::iOS SDK に ScreenCaptureKit.framework が見つかりません。"
            echo "利用可能なフレームワーク（先頭50件）:"
            ls "${SDK_PATH}/System/Library/Frameworks" | head -50
            exit 1
          fi

          echo "::group::swiftinterface"
          find "${FRAMEWORK}" -name '*.swiftinterface' | head -20
          echo "::endgroup::"

      # ---------------------------------------------------------------
      # 4. 本命。import ScreenCaptureKit が iOS 27 で通るかを型検査で確定させる
      #    スキームや署名に依存しないので、失敗＝コードの問題と断定できる
      # ---------------------------------------------------------------
      - name: Type-check sources against iOS 27 SDK
        working-directory: ${{ env.APP_DIR }}
        run: |
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "型検査の対象:"
          ls -1 *.swift

          xcrun swiftc \
            -sdk "${SDK_PATH}" \
            -target arm64-apple-ios27.0 \
            -parse-as-library \
            -typecheck \
            ArenaAssistantApp.swift \
            ContentView.swift \
            ScreenCaptureManager.swift

          echo "OK: iOS 27 SDK で型検査を通過しました。"

      # ---------------------------------------------------------------
      # 5. Swift Playgrounds の App Project としてビルドする
      #    スキーム名は .swiftpm の構成から自動で拾う
      # ---------------------------------------------------------------
      - name: List schemes
        id: schemes
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "::group::xcodebuild -list"
          xcodebuild -list || true
          echo "::endgroup::"

          SCHEME="$(xcodebuild -list 2>/dev/null \
            | sed -n '/Schemes:/,$p' \
            | sed -n '2p' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          echo "detected scheme: '${SCHEME}'"
          echo "scheme=${SCHEME}" >> "${GITHUB_OUTPUT}"

      - name: Build app for iOS 27 (no code signing)
        id: appbuild
        # 型検査が本命の判定なので、スキーム解決など周辺要因での赤化は避ける
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -o pipefail
          SCHEME='${{ steps.schemes.outputs.scheme }}'
          if [ -z "${SCHEME}" ]; then
            echo "::warning::スキームを特定できませんでした。ビルド段階を省略します。"
            exit 1
          fi

          xcodebuild build \
            -scheme "${SCHEME}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=27.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      # ---------------------------------------------------------------
      # 6. ビルド成果物の .app を探す
      #    プロダクト名は Package.swift の name（"Arena Assistant"）に
      #    依存しスペースを含みうるため、名前を決め打ちせず検索で特定する
      # ---------------------------------------------------------------
      - name: Locate built .app
        id: locate
        if: steps.appbuild.outcome == 'success'
        run: |
          PRODUCTS="${RUNNER_TEMP}/DerivedData/Build/Products"

          echo "::group::Build/Products の中身"
          ls -la "${PRODUCTS}" 2>/dev/null || echo "(Products ディレクトリがありません)"
          find "${PRODUCTS}" -maxdepth 2 -name '*.app' -type d 2>/dev/null || true
          echo "::endgroup::"

          # まず iphoneos 向けの成果物を優先して探す
          APP_PATH="$(find "${PRODUCTS}" -maxdepth 2 -type d -name '*.app' -path '*-iphoneos/*' 2>/dev/null | head -n 1)"

          # 見つからなければ DerivedData 全体を対象にする
          if [ -z "${APP_PATH}" ]; then
            APP_PATH="$(find "${RUNNER_TEMP}/DerivedData" -type d -name '*.app' 2>/dev/null | head -n 1)"
          fi

          if [ -z "${APP_PATH}" ]; then
            echo "::error::ビルドは成功しましたが .app を特定できませんでした。"
            echo "DerivedData 配下の .app 候補:"
            find "${RUNNER_TEMP}/DerivedData" -name '*.app' 2>/dev/null | head -20
            exit 1
          fi

          echo "found app: ${APP_PATH}"
          echo "app-path=${APP_PATH}" >> "${GITHUB_OUTPUT}"

          echo "::group::.app の中身"
          ls -la "${APP_PATH}"
          echo "::endgroup::"

          # 実行バイナリが iOS arm64 かどうかを確認しておく
          BIN_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_PATH}/Info.plist" 2>/dev/null || true)"
          if [ -n "${BIN_NAME}" ] && [ -f "${APP_PATH}/${BIN_NAME}" ]; then
            echo "::group::バイナリ情報"
            file "${APP_PATH}/${BIN_NAME}"
            lipo -info "${APP_PATH}/${BIN_NAME}" 2>/dev/null || true
            echo "::endgroup::"
          fi

      # ---------------------------------------------------------------
      # 7. 未署名 IPA を組み立てる
      #    IPA は Payload/ を含む単なる zip。署名は一切行わない
      # ---------------------------------------------------------------
      - name: Package unsigned IPA
        id: ipa
        if: steps.locate.outcome == 'success'
        env:
          APP_PATH: ${{ steps.locate.outputs.app-path }}
        run: |
          set -euo pipefail

          STAGE="${RUNNER_TEMP}/ipa-stage"
          IPA_PATH="${GITHUB_WORKSPACE}/ArenaAssistant-unsigned.ipa"

          rm -rf "${STAGE}" "${IPA_PATH}"
          mkdir -p "${STAGE}/Payload"

          # ditto はシンボリックリンクや属性を保ったままコピーできる。
          # .app のディレクトリ名は実行には影響しないため、要求どおりの名前に揃える。
          ditto "${APP_PATH}" "${STAGE}/Payload/ArenaAssistant.app"

          ( cd "${STAGE}" && zip -qry "${IPA_PATH}" Payload )

          echo "ipa-path=${IPA_PATH}" >> "${GITHUB_OUTPUT}"

          SIZE="$(du -h "${IPA_PATH}" | cut -f1)"
          echo "ipa-size=${SIZE}" >> "${GITHUB_OUTPUT}"
          echo "IPA: ${IPA_PATH} (${SIZE})"

          echo "::group::IPA の中身（先頭40件）"
          unzip -l "${IPA_PATH}" | head -40
          echo "::endgroup::"

          # Payload/ArenaAssistant.app/ が入っていることを確認する
          if ! unzip -l "${IPA_PATH}" | grep -q 'Payload/ArenaAssistant.app/'; then
            echo "::error::IPA に Payload/ArenaAssistant.app が含まれていません。"
            exit 1
          fi
          echo "OK: Payload/ArenaAssistant.app を確認しました。"

      # ---------------------------------------------------------------
      # 8. Artifact として公開する
      # ---------------------------------------------------------------
      - name: Upload unsigned IPA
        if: steps.ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ArenaAssistant-unsigned
          path: ArenaAssistant-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # ---------------------------------------------------------------
      # 9. 結果をまとめる
      # ---------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          {
            echo "## ArenaAssistant build result"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| Xcode | $(xcodebuild -version | head -1) |"
            echo "| iOS SDK | $(xcrun --sdk iphoneos --show-sdk-version) |"
            echo "| Swift | $(swift --version 2>&1 | head -1) |"
            echo "| Scheme | ${{ steps.schemes.outputs.scheme }} |"
            echo "| 型検査 (import ScreenCaptureKit) | 成功（このステップに到達＝通過） |"
            echo "| アプリのビルド | ${{ steps.appbuild.outcome }} |"
            echo "| .app の特定 | ${{ steps.locate.outcome }} |"
            echo "| IPA の作成 | ${{ steps.ipa.outcome }} |"
            echo ""

            if [ "${{ steps.ipa.outcome }}" = "success" ]; then
              echo "### 未署名 IPA"
              echo ""
              echo "- ビルド元: \`${{ steps.locate.outputs.app-path }}\`"
              echo "- サイズ: ${{ steps.ipa.outputs.ipa-size }}"
              echo "- Artifact 名: **ArenaAssistant-unsigned**"
              echo ""
              echo "このページ下部の Artifacts から \`ArenaAssistant-unsigned\` をダウンロードできます。"
              echo "展開すると \`ArenaAssistant-unsigned.ipa\` が入っています。"
              echo ""
              echo "> この IPA は**未署名**です。そのままでは実機にインストールできません。"
              echo "> AltStore / SideStore などで署名してから転送してください。"
              echo ""
            fi

            echo "型検査が成功していれば、iOS 27 SDK で ScreenCaptureKit を import し、"
            echo "使用している API が実在することが確認できています。"
            echo ""
            echo "アプリのビルドが failure の場合は、スキーム解決か署名設定が原因の可能性が高く、"
            echo "ScreenCaptureKit そのものの問題とは限りません。上のログを参照してください。"
          } >> "${GITHUB_STEP_SUMMARY}"
